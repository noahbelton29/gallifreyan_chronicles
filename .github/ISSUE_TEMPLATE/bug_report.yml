name: Bug report
description: Something isn't working, or the game crashed
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more detail you give, the faster it gets fixed.
        Please check the bug hasn't already been reported first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you see?
      placeholder: When I pull the throttle the TARDIS takes off but the doors stay open.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: The doors should close before takeoff.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Open the TARDIS doors
        2. Pull the space-time throttle
        3. See that the doors stay open
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Shown in the mod list, or in the jar's file name.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
        - Both
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Singleplayer
        - Multiplayer server
        - Both
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: List them, or say "none". Other mods are a common cause of bugs.
      placeholder: Jade, Sodium, Iris, Simple Voice Chat
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: |
        Paste `logs/latest.log`, or the file from `crash-reports/` if the game crashed.
        For long logs, upload to https://mclo.gs and paste the link instead.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images or videos in here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported
          required: true
        - label: I'm using the latest version of the mod
          required: false
