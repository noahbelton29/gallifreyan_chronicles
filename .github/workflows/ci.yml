name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    outputs:
      artifact: gc-dev-${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Fabric and NeoForge (with Javadoc)
        env:
          GC_LOCK_UUID: ${{ secrets.DEV_LOCK_UUID }}
        run: ./gradlew build -Pwatermark=off --console=plain

      - name: Name the artifact
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload dev jars
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: gc-dev-${{ steps.meta.outputs.short_sha }}
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

      - name: Comment the test jars on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          LOCKED: ${{ secrets.DEV_LOCK_UUID != '' }}
        run: |
          marker='<!-- gc-pr-jars -->'
          if [ "$LOCKED" = "true" ]; then
            note="Locked to the accounts in the DEV_LOCK_UUID secret."
          else
            note="Locked to nobody (no DEV_LOCK_UUID secret), so they only run on servers."
          fi
          body="$(printf '%s\n### Test jars\n[Download the Fabric and NeoForge jars](%s) built from %s. %s Kept for 14 days.' \
            "$marker" "$URL" "${HEAD_SHA::7}" "$note")"
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Check formatting
        run: |
          if ! ./gradlew spotlessCheck --console=plain; then
            echo "::error::Some files aren't formatted. Run ./gradlew spotlessApply and commit the result."
            exit 1
          fi

  datagen:
    name: Datagen is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Run datagen
        run: ./gradlew :neoforge:runData -Pwatermark=off --console=plain

      - name: Check the generated files are committed
        run: |
          changes="$(git status --porcelain -- common/src/main/resources)"
          if [ -n "$changes" ]; then
            echo "::error::Datagen output does not match what is committed. Run ./gradlew :neoforge:runData and commit the result."
            echo "$changes"
            git --no-pager diff --stat -- common/src/main/resources
            git --no-pager diff -- common/src/main/resources | head -200
            exit 1
          fi
          echo "Datagen output matches the committed files"

  translations:
    name: Translations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check translation keys
        run: python3 .github/scripts/check_translations.py

  client-code:
    name: Client code separation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check client-only code stays in client packages
        run: python3 .github/scripts/check_client_code.py

  static-state:
    name: Static state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check static state is cleared between worlds
        run: python3 .github/scripts/check_server_state.py

  style:
    name: Code style
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check imports, annotations, literals and logging
        run: python3 .github/scripts/check_style.py

  boot-test:
    name: Server boots (${{ matrix.loader }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download the built jars
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: jars

      - name: Cache the server files
        uses: actions/cache@v5
        with:
          path: |
            boot-server/${{ matrix.loader }}/libraries
            boot-server/${{ matrix.loader }}/versions
            boot-server/${{ matrix.loader }}/.fabric
            boot-server/${{ matrix.loader }}/fabric-server-launch.jar
            boot-server/${{ matrix.loader }}/run.sh
            boot-server/${{ matrix.loader }}/user_jvm_args.txt
          key: boot-server-${{ matrix.loader }}-${{ hashFiles('gradle.properties') }}

      - name: Start the server
        run: |
          jar="$(find jars -path "*${{ matrix.loader }}/build/libs/gc-${{ matrix.loader }}-*.jar" | head -n1)"
          if [ -z "$jar" ]; then
            echo "::error::No ${{ matrix.loader }} jar in the build artifact"
            exit 1
          fi
          bash .github/scripts/prod_boot_test.sh "${{ matrix.loader }}" "$jar" "boot-server/${{ matrix.loader }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-logs-${{ matrix.loader }}
          path: |
            boot.log
            boot-server/${{ matrix.loader }}/logs/
            boot-server/${{ matrix.loader }}/crash-reports/
            boot-server/${{ matrix.loader }}/installer.log
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: Discord
    needs: [build, formatting, datagen, translations, client-code, static-state, style, boot-test]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post the result
        env:
          WEBHOOK: ${{ secrets.CI_DISCORD_WEBHOOK }}
          RESULTS: ${{ toJSON(needs) }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No CI_DISCORD_WEBHOOK secret, skipping"
            exit 0
          fi
          failed="$(echo "$RESULTS" | jq -r 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | map(.key) | join(", ")')"
          if [ -z "$failed" ]; then
            title="✅ Build passed"; colour=5763719
          else
            title="❌ Build failed: $failed"; colour=15548997
          fi
          summary="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200)"
          jq -n \
            --arg title "$title" --arg url "$RUN_URL" --argjson colour "$colour" \
            --arg desc "[\`${GITHUB_SHA::7}\`]($COMMIT_URL) $summary" \
            --arg branch "$BRANCH" --arg author "$AUTHOR" \
            '{username: "GC CI", allowed_mentions: {parse: []}, embeds: [{title: $title, url: $url, color: $colour, description: $desc,
              fields: [{name: "Branch", value: $branch, inline: true}, {name: "Author", value: $author, inline: true}]}]}' \
            | curl -sS -f -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
