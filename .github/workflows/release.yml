name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Work out the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then prerelease=true; type=beta; else prerelease=false; type=release; fi
          case "$version" in *alpha*) type=alpha ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          minecraft="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "Releasing $version ($type) for Minecraft $minecraft"

      - name: Build release jars
        run: >
          ./gradlew build
          -PreleaseVersion=${{ steps.version.outputs.version }}
          -Plock=off -Pwatermark=off -PdevBypass=false
          --console=plain

      - name: Write release notes
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" | tee release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          name: Gallifreyan Chronicles ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            fabric/build/libs/gc-fabric-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/gc-neoforge-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true

      - name: Publish Fabric to Modrinth / CurseForge
        if: vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/gc-fabric-${{ steps.version.outputs.version }}.jar
          name: Gallifreyan Chronicles ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft }}
          dependencies: |
            fabric-api(required)
            geckolib(required)
            jade(optional)

      - name: Publish NeoForge to Modrinth / CurseForge
        if: vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/gc-neoforge-${{ steps.version.outputs.version }}.jar
          name: Gallifreyan Chronicles ${{ steps.version.outputs.version }} (NeoForge)
          version: ${{ steps.version.outputs.version }}+neoforge
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: ${{ steps.version.outputs.minecraft }}
          dependencies: |
            geckolib(required)
            jade(optional)
