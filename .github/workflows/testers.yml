name: Tester builds

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      testers:
        description: "Only lock to these testers (comma-separated names). Blank = everyone"
        required: false
        default: ""
      expires_in:
        description: "Expiry, like 7d, 12h or 1h30m. Blank = never"
        required: false
        default: ""
      watermark:
        description: "Watermark the jars"
        type: choice
        options: ["on", "off"]
        default: "on"
      upload_artifacts:
        description: "Also attach the jars to this run (anyone who can see the repo's Actions can download them)"
        type: boolean
        default: false

concurrency:
  group: tester-builds
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Anything new?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for new commits that passed CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          last="$(git rev-parse -q --verify 'refs/tags/tester-build^{commit}' || true)"
          if [ "$head" = "$last" ]; then
            echo "::notice::No new commits since the last tester build (${head::7}), nothing to send"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci="$(gh run list --workflow ci.yml --commit "$head" --event push --json status,conclusion \
            --jq '[.[] | select(.status == "completed")][0].conclusion // ""')"
          if [ "$ci" != "success" ]; then
            echo "::notice::Skipping tonight: CI on ${head::7} is '${ci:-not finished}'"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New commits since ${last:0:7}, CI passed on ${head::7}"
          echo "run=true" >> "$GITHUB_OUTPUT"

  testers:
    name: Build tester jars
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Write testers.properties
        env:
          TESTERS: ${{ secrets.TESTERS_PROPERTIES }}
        run: |
          if [ -z "$TESTERS" ]; then
            echo "::error::Add a TESTERS_PROPERTIES secret with the contents of your testers.properties (one name=uuid per line)."
            exit 1
          fi
          printf '%s\n' "$TESTERS" > testers.properties
          echo "Testers: $(grep -cvE '^\s*(#|$)' testers.properties)"

      - name: Build and post the jars
        env:
          GC_DISCORD_WEBHOOK: ${{ secrets.TESTER_DISCORD_WEBHOOK }}
          INPUT_TESTERS: ${{ inputs.testers }}
          INPUT_EXPIRES: ${{ inputs.expires_in }}
          INPUT_WATERMARK: ${{ inputs.watermark }}
          INPUT_UPLOAD: ${{ inputs.upload_artifacts }}
        run: |
          if [ -z "$GC_DISCORD_WEBHOOK" ] && [ "$INPUT_UPLOAD" != "true" ]; then
            echo "::error::No TESTER_DISCORD_WEBHOOK secret and artifact upload is off, so the jars would go nowhere."
            exit 1
          fi
          args=(buildSharedTesterJars --console=plain)
          [ -n "$INPUT_TESTERS" ] && args+=("-PtesterOnly=$INPUT_TESTERS")
          [ -n "$INPUT_EXPIRES" ] && args+=("-PexpiresIn=$INPUT_EXPIRES")
          [ "$INPUT_WATERMARK" = "off" ] && args+=("-Pwatermark=off")
          ./gradlew "${args[@]}"

      - name: Remove testers.properties
        if: always()
        run: rm -f testers.properties

      - name: Remember the commit that was sent
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.testers == ''
        run: |
          git tag -f tester-build
          git push -f origin tester-build

      - name: Upload the build ledger
        if: success() && inputs.watermark != 'off'
        uses: actions/upload-artifact@v7
        with:
          name: build-ledger-${{ github.run_number }}
          path: build-ledger.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the jars
        if: success() && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tester-jars-${{ github.run_number }}
          path: build/tester-jars/
          retention-days: 7
