plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

// A loader-neutral addon project. It is separate from the mod's own Gradle build.
//
// An addon is a real mod. It carries both fabric.mod.json and neoforge.mods.toml, compiles against plain Minecraft
// (no Fabric, no NeoForge code) plus the mod's COMMON jar, and so one jar works on both loaders. The mod jar is
// compileOnly: it is never put inside your addon. Mixins work because the loader loads the jar itself.

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net') }
}

neoForge {
    neoFormVersion = neo_form_version
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

def gcJar = rootProject.findModJar('common')

tasks.named('compileJava') {
    doFirst {
        if (!gcJar.exists()) throw new GradleException("Put the Gallifreyan Chronicles common jar in libs/ first, see libs/README.txt")
    }
}

dependencies {
    compileOnly files(gcJar)
    // only the mixin annotations, which Fabric and NeoForge both provide at run time
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
}

jar {
    archiveBaseName = addon_id
    archiveVersion = addon_version
}
