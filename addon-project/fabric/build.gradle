plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

// A Fabric dev game with the mod and your addon. Nothing here is shipped.
// ./gradlew :fabric:runClient

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net') }
    maven { url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/') }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

def modJar = rootProject.findModJar('fabric')
// only checked when you actually run this loader, so building just the addon needs only the common jar
tasks.register('checkModJar') {
    doLast {
        if (!modJar.exists()) throw new GradleException("Put the mod's Fabric jar at libs/, see libs/README.txt")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    runtimeOnly files(modJar)
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    runtimeOnly "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
        }
    }
}

// an addon is a mod, so the dev game loads it from run/mods: build the jar and put it there first
tasks.register('installAddon', Copy) {
    dependsOn ':addon:jar'
    from project(':addon').tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('run/mods')
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'installAddon', 'checkModJar' }
