plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

def baseVersion = project.version.toString()
def buildStamp = java.time.LocalDateTime.now().format(java.time.format.DateTimeFormatter.ofPattern('yyddMM-HHmm'))
// CI release builds pass -PreleaseVersion=1.2.3 (from the git tag) for a clean version with no dev stamp
def releaseVersion = providers.gradleProperty('releaseVersion').orNull
allprojects {
    version = releaseVersion ?: "${baseVersion}-dev-${buildStamp}"
}

subprojects {
    afterEvaluate {
        def base = extensions.findByType(org.gradle.api.plugins.BasePluginExtension)
        if (base != null) {
            base.archivesName.set("gc-${project.name}")
        }
    }
}

apply from: 'gradle/tester-builds.gradle'
