    runtimeOnly("maven.modrinth:jade:${jade_fabric_version}")
    compileOnly("maven.modrinth:essential:${essential_version}")
//    runtimeOnly("maven.modrinth:essential:${essential_version}")
    runtimeOnly(files(essentialDevDir).builtBy(essentialDevSetup))
