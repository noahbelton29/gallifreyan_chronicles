plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        url = uri("https://maven.minecraftforge.net/")
    }
    maven {
        url = uri("https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/")
    }
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("foundry.imguimc")
        }
    }
}



dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    compileOnly("maven.modrinth:modmenu:${modmenu_version}")
    runtimeOnly("maven.modrinth:modmenu:${modmenu_version}")
//    implementation(include("foundry.imguimc:imguimc-fabric-${providers.gradleProperty("minecraft_version").get()}:${providers.gradleProperty("imguimc_version").get()}"))

    runtimeOnly("maven.modrinth:sodium:${providers.gradleProperty("sodium_version").get()}")
    runtimeOnly("maven.modrinth:iris:${providers.gradleProperty("iris_version").get()}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

dependencies {
    implementation("com.geckolib:geckolib-fabric-${providers.gradleProperty("minecraft_version").get()}:${providers.gradleProperty("geckolib_version").get()}")
    compileOnly("maven.modrinth:jade:${jade_fabric_version}")
    runtimeOnly("maven.modrinth:jade:${jade_fabric_version}")
//    implementation("foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}")
//    runtimeOnly("foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}")
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

def gcBuildIdDir = layout.buildDirectory.dir('generated/gc-build-id')
def gcTesterLabel = providers.gradleProperty('testerLabel').orElse('-')
def gcWatermarkOff = providers.gradleProperty('watermark')
        .map { it.equalsIgnoreCase('off') || it.equalsIgnoreCase('false') }
        .orElse(false)
def gcLedgerFile = rootProject.layout.projectDirectory.file('build-ledger.csv')

def generateBuildId = tasks.register('generateBuildId') {
    outputs.dir(gcBuildIdDir)
    outputs.upToDateWhen { false }
    doLast {
        def alphabet = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'
        def random = new java.security.SecureRandom()
        def buildId = (1..8).collect { alphabet.charAt(random.nextInt(alphabet.length())) }.join()
        def watermarkOn = !gcWatermarkOff.get()

        def dir = gcBuildIdDir.get().asFile
        dir.mkdirs()
        new File(dir, 'gc_build.properties').text = "build_id=${buildId}\nwatermark=${watermarkOn}\n"

        if (watermarkOn) {
            def label = gcTesterLabel.get().replaceAll('[^A-Za-z0-9._ -]', '_')
            def ledger = gcLedgerFile.asFile
            if (!ledger.exists()) ledger.text = 'timestamp,build_id,tester,jar\n'
            def jarName = "gc-${project.name}-${project.version}.jar"
            ledger << "${java.time.OffsetDateTime.now()},${buildId},${label},${jarName}\n"
            logger.lifecycle("Watermark build ID ${buildId} for tester '${label}' (logged to build-ledger.csv)")
        } else {
            logger.lifecycle('Watermark disabled for this build')
        }
    }
}

sourceSets.main.resources.srcDir(gcBuildIdDir)
tasks.named('processResources') { dependsOn(generateBuildId) }
