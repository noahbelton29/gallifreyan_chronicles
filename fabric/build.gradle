loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs "--username", "Tester1"
            property('fabric.remapClasspathFile', layout.buildDirectory.file('essential-dev/remapClasspath.txt').get().asFile.absolutePath)
        }
        client2 {
            client()
            name = "Client 2"
            runDir "run2"
            programArgs "--username", "Tester2"
            property('fabric.remapClasspathFile', layout.buildDirectory.file('essential-dev/remapClasspath.txt').get().asFile.absolutePath)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def essentialDevDir = layout.buildDirectory.dir('essential-dev')
def essentialDevSetup = tasks.register('essentialDevSetup') {
    def outDir = essentialDevDir
    def remapClasspath = configurations.compileClasspath
    inputs.files(remapClasspath)
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        new File(dir, 'mappings').mkdirs()
        new File(dir, 'mappings/mappings.tiny').text = "tiny\t2\t0\tofficial\tintermediary\tnamed\n"
        new File(dir, 'remapClasspath.txt').text = remapClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
    }
}

dependencies {
    implementation("com.geckolib:geckolib-fabric-${providers.gradleProperty("minecraft_version").get()}:${providers.gradleProperty("geckolib_version").get()}")
